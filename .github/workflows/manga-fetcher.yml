name: Manga Fetcher Workflow
on:
  repository_dispatch:
    types: [fetch_manga]

jobs:
  fetch_manga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Fetch and Upload Manga
        env:
          WP_URL: 'https://weebhq.com'
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python manga_fetcher.py "${{ github.event.client_payload.manga_id }}" "${{ github.event.client_payload.chapter_id }}" "${{ github.event.client_payload.chapter_num }}" "${{ github.event.client_payload.chapter_title }}"