name: Pinterest Auto Wallpaper Bot
on:
  schedule:
    - cron: '0 */4 * * *'  # Runs every 4 hours
  workflow_dispatch: # Allows manual trigger from UI

permissions:
  contents: write # Needed to commit history.txt back

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Pinterest Bot
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python pinterest_bot.py

      - name: Commit History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f pinterest_history.txt ]; then
            git add pinterest_history.txt
            # Only commit and push if history file has changed
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update Pinterest pin history" && git push)
          else
            echo "No history file to commit."
          fi