name: Video Bot Workflow
on:
  repository_dispatch:
    types: [generate_video]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts pillow moviepy playwright
          pip install https://github.com/HuiiBuh/TikTok-Uploader/archive/refs/heads/main.zip
          playwright install

      - name: Run Video Generator
        env:
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
        run: python generate_video.py "${{ github.event.client_payload.title }}" "${{ github.event.client_payload.summary }}" "${{ github.event.client_payload.image_url }}" "${{ github.event.client_payload.permalink }}"